name: Copilot Code Review Setup

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record untrusted head setup source
        run: |
          printf '%s\n' 'GH_R99_HEAD_SETUP_29e6c481' | tee "$GITHUB_WORKSPACE/.gh-r99-setup-source"
